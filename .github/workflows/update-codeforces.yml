name: Update Codeforces stats

on:
  push:
    paths:
      - "scripts/update_codeforces.py"
      - ".github/workflows/update-codeforces.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codeforces
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Codeforces data and generate SVG
        env:
          CF_HANDLE: T_CrB
        run: python scripts/update_codeforces.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-stats.svg
          git diff --cached --quiet || git commit -m "chore: update Codeforces stats"
          git push
